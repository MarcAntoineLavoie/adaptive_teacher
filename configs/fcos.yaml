_BASE_: "./Base-FCOS.yaml"
INPUT:
  CLEAN_DETECTIONS: False
  MAX_OCCLUSION: 0.5
  CROP:
    ENABLED: True
  USE_RANDOM_NOISE: True
  DINO_PATCH_SIZE: 16
  PAD_CROP: True
MODEL:
  PIXEL_STD: [1.,1.,1.]
  META_ARCHITECTURE: "DAPLFCOS"
  BACKBONE:
    NAME: "build_retinanet_resnet_fpn_backbone"
  MASK_ON: False
  RESNETS:
    DEPTH: 50
  FPN:
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
  RETINANET:
    NUM_CLASSES: 8
    IOU_THRESHOLDS: [0.4, 0.5]
    IOU_LABELS: [0, -1, 1]
    SMOOTH_L1_LOSS_BETA: 0.0
  PROBABILISTIC_MODELING:
  # One of the following Loss types: 'none' or 'negative_log_likelihood', 'second_moment_matching', 'energy_loss'.
    BBOX_COV_LOSS:
        NAME: 'energy_loss'
        # NAME: 'negative_log_likelihood'
        COVARIANCE_TYPE: 'diagonal' # One of the following: 'full', 'diagonal'
        NUM_SAMPLES: 1000
        # NAME: 'energy_loss2'
        # # NAME: 'negative_log_likelihood'
        # COVARIANCE_TYPE: 'diagonal' # One of the following: 'full', 'diagonal'
        # NUM_SAMPLES: 50
    ANNEALING_STEP: 10000
    PROB_IOU: False
    SELECT_IOU: False
    SELECT_IOU2: False
    SCALE_LOSS: False
    SCALE_EXPO_SCORE: 1.0
    SCALE_EXPO_IOU: 1.0
    GT_INJECT_COV_WEIGHT: 1.0
  # WEIGHTS: "/media/marc/data_checks1/R-101.pkl"
  WEIGHTS: "/media/marc/data_checks1/R-50.pkl"
  # WEIGHTS: "/media/marc/data_checks1/results_dino/cityfog/bl20k/model_0019999.pth"
SOLVER:
  LR_SCHEDULER_NAME: "WarmupTwoStageMultiStepLR"
  STEPS: (60000, 80000, 90000, 360000)
  FACTOR_LIST: (1, 1, 1, 1, 1)
  MAX_ITER: 10000
  # IMG_PER_BATCH_LABEL: 16
  # IMG_PER_BATCH_UNLABEL: 16
  IMG_PER_BATCH_LABEL: 2
  IMG_PER_BATCH_UNLABEL: 2
  # BASE_LR: 0.04
  # BASE_LR: 0.01
  BASE_LR: 0.001
  # CLIP_GRADIENTS:
    # ENABLED: True
    # CLIP_TYPE: "norm"
    # CLIP_VALUE: 0.5
DATALOADER:
  SUP_PERCENT: 100.0
  # SAMPLER_TRAIN: "RepeatFactorTrainingSampler"
  # REPEAT_THRESHOLD: 0.1
DATASETS:
  CROSS_DATASET: True
  # TRAIN_LABEL: ("cityscapes_fine_instance_seg_train",)
  # TRAIN_UNLABEL: ("cityscapes_foggy_train",)
  # TEST: ("cityscapes_foggy_val",)
  # TRAIN_UNLABEL: ("ACDC_train_all",)
  # TRAIN_UNLABEL: ("BDD_day_train",)
  # TEST: ("cityscapes_fine_instance_seg_train","cityscapes_val")
  # TEST: ("cityscapes_val",)
  # TEST: ("cityscapes_val","BDD_day_val")
  # TEST: ("cityscapes_foggy_val002",)
  # TRAIN_UNLABEL: ("cityscapes_foggy_train002",)
  TRAIN_LABEL: ("ACDC_train_night",)
  TRAIN_UNLABEL: ("ACDC_train_night",)
  TEST: ("ACDC_val_night",)
SEMISUPNET:
  Trainer: "ateacher"
  BBOX_THRESHOLD: 0.8
  # BBOX_THRESHOLD: 0.15
  TEACHER_UPDATE_ITER: 1
  # BURN_UP_STEP: 20000
  BURN_UP_STEP: 2
  EMA_KEEP_RATE: 0.9996
  # EMA_KEEP_RATE: 0.999
  UNSUP_LOSS_WEIGHT: 0.0
  SUP_LOSS_WEIGHT: 1.0
  # DIS_TYPE: "vgg4" #["concate","p2","multi"]
  DIS_TYPE: "p2" #["concate","p2","multi"]
  DIS_LOSS_WEIGHT: 0.0
  DOMAIN_ADV_INST: 0.0
  # DOMAIN_ADV_INST: 1.0
  ALIGN_PROPOSALS: False
  ALIGN_LOSS: "MMD"
  # ALIGN_LOSS: "contrast"
  ALIGN_WEIGHT: 0.10
  ALIGN_PARAM: 0.07
  ALIGN_PARAM_BASE: 0.07
  ALIGN_INTRA: False
  ALIGN_NORMED: False
  # ALIGN_SUBSAMPLING: "random"
  ALIGN_SUBSAMPLING: "centre"
  ALIGN_USE_BG: False
  ALIGN_POINTS_PER_PROPOSALS: 10
  ALIGN_QUEUE_LENGHT: 200
  ALIGN_MAX_BATCH: 200
  ALIGN_SCALE_COUNT: False
  ALIGN_BASE_COUNT: 200
  USE_GT_PROPOSALS: False
  USE_GT_PROPOSALS_ONLY: False
  ALIGN_USE_NEGATIVES: True
  ALIGN_GT_PROPOSALS: False
  ALIGN_USE_PROJ: False
  ALIGN_PROTOTYPES: False
  # ALIGN_PROTOTYPES_ONLY: True
  ALIGN_SOURCE_PROT_ONLY: False
  BOX_NORM_CLASS: False
  EVAL_PSEUDO_LABELS: False
  SUPPRESS_BBOX_CORR: 1.0
  PSEUDO_THRESH_BOTH: False
  PSEUDO_OBJ_THRESH: 1.0
  USE_DINO: False
  DINO_LOSS_WEIGHT: 1.0
  DINO_LOSS_WEIGHT_TARGET: 1.0
  DINO_SOURCE_BG_WEIGHT: 1.0
  DINO_SOURCE_FG_THRESH: 0.2
  DINO_LOSS_NORM: True
  DINO_HEAD: 'MLP'
  DINO_MODEL: "dinov2_vitb14"
  DINO_INSTANCE_MASK: False
  DINO_TARGET_MASK: False
  DINO_ALIGN_LOSS: "similarity"
  DINO_CONT_QUEUE_LENGTH: 4096
  DINO_CONT_TEMP: 0.1
  DINO_CONT_IGNORE_CLOSEST: 2
  FREEZE_POSTPRETRAIN: False
  PRETRAIN_STEPS: 0
  DINO_PROJ_GELU: False
  # DINO_TARGET_PSEUDOGT: /media/marc/data_checks1/acdc/gt_detection_trainval/gt_detection/night/train/dino_anno.pkl
  # DINO_TARGET_PSEUDOGT: None
  # DINO_PSEUDOGT_SWAP: 'half'
  # DINO_PSEUDOGT_SWAP_ITER: 10
  DINO_ALIGN_ONLY_UNTIL: -1
  DINO_ALIGN_EASY_ONLY: True
  DINO_SAM_MASK: False
TEST:
  # EVAL_PERIOD: 1000
  EVAL_PERIOD: 10



